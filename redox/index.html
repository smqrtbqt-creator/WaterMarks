<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var marker = '/redox'
        var path = location.pathname
        var at = path.indexOf(marker)
        var root = marker + '/'
        if (at !== -1) {
          var next = path.charAt(at + marker.length)
          if (!next || next === '/') root = path.slice(0, at + marker.length) + '/'
        }
        document.write('<base href="' + root + '">')
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071015" />
    <meta
      name="description"
      content="Jeu de poste de conduite : faire circuler les électrons dans une usine de traitement de l’eau."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Mono:wght@400;600&family=Outfit:wght@400;570;700&display=swap"
      rel="stylesheet"
    />
    <title>Station redox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
